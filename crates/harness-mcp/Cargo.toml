[package]
name = "harness-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-grant-ledger = { version = "0.1.0", path = "../harness-grant-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1.42", features = ["rt", "time"] }

# AppContainer隔離（D-38）はWindows専用。他OSではMCPサーバを起動しない（P-05）ため、
# サンドボックス側への依存もWindowsだけで持つ。
[target.'cfg(windows)'.dependencies]
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }

[dev-dependencies]
tempfile = "3"
# `Tool::call`（async）のテストで`#[tokio::test]`を使うため。
tokio = { version = "1.42", features = ["macros", "rt"] }
