[package]
name = "harness-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-grant-ledger = { version = "0.1.0", path = "../harness-grant-ledger" }
# Streamable HTTP（M15.6、D-41）。`harness-providers`がAnthropic/OpenAIと話すのと**同じ**
# TLSスタック（`rustls` featureは依存木上`rustls-platform-verifier`＝WindowsではOS証明書
# ストア）に載せる。この経路のために別の検証器を持ち込まない（D-51）。
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
# 証明書ピン（D-52）の`ServerCertVerifier`を書くため。**`reqwest`が使うのと同じ0.23系**で
# なければ`tls_backend_preconfigured`のダウンキャストが通らない。
rustls = "0.23"
# 承認時に「実際に提示された証明書」の発行元・サブジェクト・SAN・有効期限を見せるため
# （D-52。指紋だけでは何を承認しているのか判断できない）。**表示のためだけ**に使う——
# 検証はrustlsが行い、このパーサの結果は信頼の判断に一切入らない。
x509-parser = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1.42", features = ["rt", "time"] }

# AppContainer隔離（D-38）はWindows専用。他OSではMCPサーバを起動しない（P-05）ため、
# サンドボックス側への依存もWindowsだけで持つ。
[target.'cfg(windows)'.dependencies]
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }

[dev-dependencies]
tempfile = "3"
# `Tool::call`（async）のテストで`#[tokio::test]`を使うため。
tokio = { version = "1.42", features = ["macros", "rt", "time"] }
# D-51/D-52の受け入れテスト（`tests/http_tls.rs`）用。**テストにしか無い**——本番側は
# 自己署名証明書を作る手段もTLSを終端する手段も持たない。
rcgen = "0.14"
