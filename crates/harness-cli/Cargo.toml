[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "harness_cli"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15.7"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-engine = { version = "0.1.0", path = "../harness-engine" }
harness-providers = { version = "0.1.0", path = "../harness-providers" }
harness-tools = { version = "0.1.0", path = "../harness-tools" }
harness-tui = { version = "0.1.0", path = "../harness-tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
