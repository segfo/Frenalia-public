[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "harness_cli"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

[features]
# out-of-processのE2Eテスト（`tests/tier2a_e2e.rs`・`tests/recall_e2e.rs`）専用。既定オフ、
# リリースビルドに一切露出しない（`--provider mock`はテストフックのため、`docs/DEV-ENVIRONMENT.md`
# 「Tier2a E2Eテストの実行方法」参照）。`harness-cognition/e2e-test-hooks`を連れてくるのは、
# Recall E2Eが記憶の置き場を実`%APPDATA%`から一時ディレクトリへ逃がすため
# （`HARNESS_TEST_RECALL_DATA_ROOT`）。
e2e-mock = ["harness-cognition/e2e-test-hooks"]
# 実プロバイダ（ローカルのLMStudio）を呼ぶ試験（`tests/tier2a_e2e.rs`の
# `tier2a_cow_change_census_lmstudio`、段5の測定の実モデルの腕）専用。**試験だけが参照し、
# `src/`からは参照しない**ので、立てても`harness.exe`は1ビットも変わらない。
# `e2e-mock`と分けてあるのは、`e2e-all`（`e2e-mock`だけを立てる全件実行）を
# LMStudioが無い機でも回せるようにするため。
e2e-live = ["e2e-mock"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
directories = "6"
dotenvy = "0.15.7"
harness-change-ledger = { version = "0.1.0", path = "../harness-change-ledger" }
harness-cognition = { version = "0.1.0", path = "../harness-cognition" }
harness-config = { version = "0.1.0", path = "../harness-config" }
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-grant-ledger = { version = "0.1.0", path = "../harness-grant-ledger" }
harness-engine = { version = "0.1.0", path = "../harness-engine" }
harness-mcp = { version = "0.1.0", path = "../harness-mcp" }
harness-policy = { version = "0.1.0", path = "../harness-policy" }
harness-providers = { version = "0.1.0", path = "../harness-providers" }
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }
harness-sandbox-vm = { version = "0.1.0", path = "../harness-sandbox-vm" }
harness-tools = { version = "0.1.0", path = "../harness-tools" }
harness-tui = { version = "0.1.0", path = "../harness-tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
