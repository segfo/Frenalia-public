[package]
name = "harness-term"
version.workspace = true
edition.workspace = true

# 端末の生モード/オルタネートスクリーンをRAII+panic hookで必ず復帰させる下回り。
#
# `harness-tui`（会話TUI）と`harness-policy-editor`（ポリシーエディタTUI）の**2つの独立した
# バイナリ**が同じ端末制御を要るため、片方に置いてもう片方が依存する形にはできない
# ——ポリシーエディタは「harness.exeとは別にユーザーが直接起動する2つ目のバイナリ」であり、
# 会話エージェント（engine/cognition/providers）に依存させたくない。かといってコピーすると、
# 端末復帰は**壊れても例外が出ない**種類のロジックなので、ずれても誰も気付かない
# （`docs/CODE-STRUCTURE-RULES.md`規則5）。
[lib]
name = "harness_term"
path = "src/lib.rs"

[dependencies]
crossterm = "0.29"
# 末尾追従のスクロール表示（`scrollback`）が`Paragraph::line_count`を使う。
# **折り返し後の表示行**を数えるのに要るのが`unstable-rendered-line-info`で、
# ここを折り返し前のバッファ行で代用すると、長い行があるだけでスクロール量と
# 見えているものがずれる（実際にポリシーエディタでそうなった）。
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
# 送れる枠（`scrollable`）の下辺の「N〜M/T行」が下辺に入るかを、表示桁で数える。
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
# 画面を握っている間だけ標準エラー出力を預かる（`stderr_capture`。ライブラリの`eprintln!`が画面を壊すため）。
# 選んだ文章をクリップボードへ書く（`clipboard`。`DataExchange`がクリップボード、`Memory`が渡すメモリ）。
# 表示言語を読む（`ui_language_id`。`Globalization`）。
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3.27.0"
