[package]
name = "harness-redirector"
version.workspace = true
edition.workspace = true

# x64専用の最小Redirector DLL（Phase 2、`plans/AppContainerベース Copy-on-Write ワークスペース
# 設計書.md` §13）。対象プロセス（AppContainer子、workspace ROが前提）へ注入され、
# `NtCreateFile`/`NtOpenFile`をフックしてWorkspaceへの書込操作をCoWの差分層へ誘導する。
# フックは境界ではなく誘導（`plans/DESIGN-SANDBOX.md` D-01/D-30）——このクレート自体が
# harness-sandbox/harness-coreに依存しないのは、注入先の非信頼プロセス内で動く別アドレス
# 空間のコードであり、境界を構成する側（`win_appcontainer.rs`）とは信頼レベルが異なるため。
[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
# `retour`はi686（x86、Phase 4b WOW64再注入向け）で0.3系がビルド不能（クレート自体の
# `impl_hookable!`マクロが`extern "win64"`を`target_arch`ゲート無しで全ターゲットへ展開しようと
# しコンパイルエラーになる、実機確認済み）。`target_arch`ゲートが修正済みの0.4系プレリリースへ
# x64・x86両方を統一する（`plans/AppContainerベース Copy-on-Write ワークスペース設計書.md` §13.2、
# x64側も切り替え後にcow_diagnostics全件（x64/WOW64/Memory-mapped file/ledger系）で再検証済み）。
retour = { version = "0.4.0-alpha.4", default-features = false }
harness-change-ledger = { version = "0.1.0", path = "../harness-change-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Wdk_System_Threading",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"
