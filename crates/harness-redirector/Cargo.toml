[package]
name = "harness-redirector"
version.workspace = true
edition.workspace = true

# x64専用の最小Redirector DLL（Phase 2、`plans/AppContainerベース Copy-on-Write ワークスペース
# 設計書.md` §13）。対象プロセス（AppContainer子、workspace ROが前提）へ注入され、
# `NtCreateFile`/`NtOpenFile`をフックしてWorkspaceへの書込操作をCoW upperへ誘導する。
# フックは境界ではなく誘導（`plans/DESIGN-SANDBOX.md` D-01/D-30）——このクレート自体が
# harness-sandbox/harness-coreに依存しないのは、注入先の非信頼プロセス内で動く別アドレス
# 空間のコードであり、境界を構成する側（`win_appcontainer.rs`）とは信頼レベルが異なるため。
[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
retour = { version = "0.3", default-features = false }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
] }
