[package]
name = "harness-policy-editor"
version.workspace = true
edition.workspace = true

# TOMOYO風ポリシーエディタ（`plans/POLICY-EDITOR-TOMOYO-DIG.md`）。
# `harness.exe`とは別に**ユーザーが直接起動する**2つ目のバイナリで、
# 記録→編集⇄テストの3状態でポリシーを収束させる。
#
# クレート名とバイナリ名を揃える（既存の`harness-netfilterd`等と同じ形）。
[lib]
name = "harness_policy_editor"
path = "src/lib.rs"

[[bin]]
name = "harness-policy-editor"
path = "src/main.rs"

[dependencies]
harness-config = { version = "0.1.0", path = "../harness-config" }
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-policy = { version = "0.1.0", path = "../harness-policy" }
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    # 記録セッションの同時実行を1本に絞るグローバル名前付きmutex（決定事項13）。
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
