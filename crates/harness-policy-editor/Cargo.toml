[package]
name = "harness-policy-editor"
version.workspace = true
edition.workspace = true

# TOMOYO風ポリシーエディタ（`plans/POLICY-EDITOR-TOMOYO-DIG.md`）。
# `harness.exe`とは別に**ユーザーが直接起動する**2つ目のバイナリで、
# 記録→編集⇄テストの3状態でポリシーを収束させる。
#
# クレート名とバイナリ名を揃える（既存の`harness-netfilterd`等と同じ形）。
[lib]
name = "harness_policy_editor"
path = "src/lib.rs"

[[bin]]
name = "harness-policy-editor"
path = "src/main.rs"

[dependencies]
harness-config = { version = "0.1.0", path = "../harness-config" }
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-policy = { version = "0.1.0", path = "../harness-policy" }
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }
# 記録モードのTier1起動は`run_shell`とまったく同じブートストラップを通す（4経路目、B-05）。
harness-tools = { version = "0.1.0", path = "../harness-tools" }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# パス1は`spawn_streaming`が返すreceiverのためだけに要る（`sync`）。パス2は加えて
# Local Proxy / Fake DNS を回すランタイムが要るが、**背景ドライバとしてだけ**使う
# （オーケストレーション本体は同期で、`block_on`は短い起動呼び出しにしか使わない。B-31）。
tokio = { version = "1.52.3", features = ["sync", "rt-multi-thread", "time", "net"] }
which = "7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    # 記録セッションの同時実行を1本に絞るグローバル名前付きmutex（決定事項13）。
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
