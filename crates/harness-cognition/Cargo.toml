[package]
name = "harness-cognition"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-engine = { version = "0.1.0", path = "../harness-engine" }
harness-tools = { version = "0.1.0", path = "../harness-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"

[dev-dependencies]
harness-providers = { version = "0.1.0", path = "../harness-providers" }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
