[package]
name = "harness-engine"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.89"
futures = "0.3.32"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-tools = { version = "0.1.0", path = "../harness-tools" }
serde_json = "1"
tokio = { version = "1.52.3", features = ["sync"] }

[dev-dependencies]
harness-providers = { version = "0.1.0", path = "../harness-providers" }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
