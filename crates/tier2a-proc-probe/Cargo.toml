[package]
name = "tier2a-proc-probe"
version.workspace = true
edition.workspace = true

# Tier2a `--cow`の子・孫・ひ孫プロセス封じ込めE2Eテスト用プローブ。i686（WOW64孫世代の
# 検査）でもビルドできることが必須要件のため、依存はwindows/serde_json最小限に絞る
# （clapは使わず引数は手書きパース）。

[[bin]]
name = "tier2a_proc_probe"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    # --- MAC/Spawn Daemon設計の実現性スパイク用（plans/mac-spike/RESULTS.md）。
    # ブローカー生成（WMI・タスクスケジューラ）とオブジェクト到達性の実測に要る。
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_Variant",
    "Win32_System_TaskScheduler",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Rpc",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    # §7.1.1測定3: 同じコンソールに繋がったプロセス同士が画面バッファを読めるか・
    # 互いへCtrl+Breakを撃てるか（`console_share`）。
    "Win32_System_Console",
] }
