[package]
name = "harness-grant-ledger"
version.workspace = true
edition.workspace = true

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    # CreateMutexW が SECURITY_ATTRIBUTES を取るため Win32_Security も要る。
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
