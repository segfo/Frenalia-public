[package]
name = "harness-sandbox"
version.workspace = true
edition.workspace = true

[dependencies]
cap-std = "4.0.2"
directories = "6"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-change-ledger = { version = "0.1.0", path = "../harness-change-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"

[target.'cfg(target_os = "linux")'.dependencies]
which = "7"

[target.'cfg(windows)'.dependencies]
which = "7"
# Tier3（`vmsandbox`）のIncus mTLSクライアント用。デーモンプロセス内で同期IPC呼び出しの
# 一部として使うため`blocking`を使う（`vmsandboxd`自体が非async、`netfilterd`と同じ設計）。
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
# Tier3（`smb_share`）のセッション使い捨てSMBアカウントのパスワード生成用（OSの
# CSPRNGを使う`rand::rngs::OsRng`経由、`unique_session_id`のPID+タイムスタンプとは
# 異なり実際に秘密として使うため暗号論的乱数が必要）。
rand = "0.9"
# Tier3準備画面の合成進捗ticker（`vmsandboxd_progress`）用。`vmsandboxd`自体は非asyncのまま
# （`spawn_blocking`越しに呼ばれる）で、tokioはこのtickerと呼び出し側の`select!`にのみ使う。
tokio = { version = "1.52.3", features = ["sync", "time"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
    # Phase 2（D-30 `--cow`のRedirector DLL注入）: WriteProcessMemory/CreateRemoteThread/
    # LoadLibraryW解決に使う。
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3.27.0"
