[package]
name = "harness-sandbox"
version.workspace = true
edition.workspace = true

[dependencies]
cap-std = "4.0.2"
directories = "6"
# M15.7: OS監査収集器が書く`fs-audit.jsonl`のレコード型（`harness_policy::FsAuditEvent`）と
# access語彙（`harness_config::FsAccess`）を、読む側（`harness-cli`）と共有するため。
# どちらも純粋クレートで、Win32もasyncも持ち込まない。
harness-config = { version = "0.1.0", path = "../harness-config" }
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-policy = { version = "0.1.0", path = "../harness-policy" }
harness-change-ledger = { version = "0.1.0", path = "../harness-change-ledger" }
harness-grant-ledger = { version = "0.1.0", path = "../harness-grant-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `textdiff`（レビュー面のdiffエンジン）。行単位diffとハンク分割（`grouped_ops`）を提供する。
# 表示側（TUIのレビューパネル・edit_file承認モーダル）と適用側（`apply_hunks`の部分適用）が
# **同じ実装**でハンクを計算する必要があるため、この1箇所だけが差分アルゴリズムを持つ
# （`plans/PLAN-VSCODE-REVIEW.md`「ハンク計算は表示側と適用側で同一実装を使う」）。
similar = { version = "2", default-features = false, features = ["text"] }
thiserror = "2.0.18"
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
which = "7"

[target.'cfg(windows)'.dependencies]
which = "7"
# tier1（`win_restricted`）・tier2b（`linux_bwrap`）が使う（Tier3の`vmsandboxd_progress`が
# 使っていたのはharness-sandbox-vmへ移設済み）。
tokio = { version = "1.52.3", features = ["sync", "time"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    # BUG-051: 子プロセスのコンソール出力（起動直後のANSIコードページメッセージと
    # プリアンブル適用後のUTF-8が混在し得る）を行単位でデコードするために使う
    # （`win_common::decode_console_bytes`）。
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
    # Phase 2（D-30 `--cow`のRedirector DLL注入）: WriteProcessMemory/CreateRemoteThread/
    # LoadLibraryW解決に使う。
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    # M15.7（ポリシー学習ヘルパー）: `Microsoft-Windows-Kernel-File`のリアルタイム
    # ETWセッションと、TDHによるイベントプロパティ抽出に使う。
    "Win32_System_Diagnostics_Etw",
    # M15.7スパイク: `NtCreateFile`をRootDirectory相対で直接呼び、ETWの各系統が
    # 相対openをどう報告するかを実測する（BUG-033と同じ形の入力を作るため）。
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
    # `EVENT_TRACE_LOGFILEW`/`OpenTraceW`は`Win32_System_Time`（`SYSTEMTIME`）を
    # 構造体メンバに持つため、Etw単体では有効にならない。
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile = "3.27.0"
