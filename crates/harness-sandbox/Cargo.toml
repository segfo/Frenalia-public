[package]
name = "harness-sandbox"
version.workspace = true
edition.workspace = true

[dependencies]
cap-std = "4.0.2"
directories = "6"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-change-ledger = { version = "0.1.0", path = "../harness-change-ledger" }
harness-grant-ledger = { version = "0.1.0", path = "../harness-grant-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
which = "7"

[target.'cfg(windows)'.dependencies]
which = "7"
# tier1（`win_restricted`）・tier2b（`linux_bwrap`）が使う（Tier3の`vmsandboxd_progress`が
# 使っていたのはharness-sandbox-vmへ移設済み）。
tokio = { version = "1.52.3", features = ["sync", "time"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    # BUG-051: 子プロセスのコンソール出力（起動直後のANSIコードページメッセージと
    # プリアンブル適用後のUTF-8が混在し得る）を行単位でデコードするために使う
    # （`win_common::decode_console_bytes`）。
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
    # Phase 2（D-30 `--cow`のRedirector DLL注入）: WriteProcessMemory/CreateRemoteThread/
    # LoadLibraryW解決に使う。
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3.27.0"
