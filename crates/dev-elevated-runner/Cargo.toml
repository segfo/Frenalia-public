[package]
name = "dev-elevated-runner"
version.workspace = true
edition.workspace = true

# 開発用ツール。このセッションのE2Eテスト実行（`sudo cargo test`等）が、無人のBashツール
# 環境ではUACダイアログを誰も操作できずタイムアウトする問題への対処。
#
# 本物のharness製品（harness.exe/harness-netfilterd.exe/harness-privhelper.exe）とは
# 完全に無関係で、リリース成果物には一切含めない。デーモン(`dev-elevated-runnerd`)は
# 初回起動時のみUAC 1回を要求し、以後は現在ユーザSID限定DACLの名前付きパイプ経由で
# クライアント(`dev-elevated-run`)からの要求を受ける。クライアントは自由なコマンドラインを
# 一切送らない——送るのは`KNOWN_TARGETS`（`src/lib.rs`）のキー名1つだけで、実際に実行される
# `cargo`引数列はサーバ側にハードコードされた固定テーブルから引く。クライアント由来の
# 文字列が引数配列へ混入する経路が無いため、`&&`/`;`等のシェルメタ文字を弾く個別チェックは
# 不要（キーが完全一致しない時点で拒否される）。
#
# 例外が1つだけある: `RunRequest::LaunchPrivhelper`（E2E専用、`src/privhelper_broker.rs`）は
# 実行時にしか決まらないパイプ名と置き場を運ぶ。固定テーブルでは表せないので、代わりに
# 「`C:\harness-e2e\`配下・ファイル名は固定・中身が`target\debug`のビルドとバイト一致・
# パイプ名は`harness-privhelper-*`の形」の4点をサーバ側で検査する。最終要求から30分操作が無ければ自動終了する
# （タイマーではなく次接続待ちのタイムアウト、`docs/bugs/BUG-046.md`・退役した
# %TEMP%キューデーモンの教訓を踏まえた設計）。

[[bin]]
name = "dev-elevated-runnerd"
path = "src/server.rs"

[[bin]]
name = "dev-elevated-run"
path = "src/client.rs"

[dependencies]
# D-44の逃がし弁の環境変数名を**文字列として複製しない**ために依存する（規則5）。
# 名前がずれると、E2Eが「ゲートに引っ掛かって全滅」という形で静かに壊れる。
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# ブローカーの禁止側テスト（`C:\harness-e2e\`の外を指す実在ディレクトリ）で使う。
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
