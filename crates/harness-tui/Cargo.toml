[package]
name = "harness-tui"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.89"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.32"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-engine = { version = "0.1.0", path = "../harness-engine" }
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }
harness-tools = { version = "0.1.0", path = "../harness-tools" }
ratatui = "0.30.2"
serde_json = "1"
tokio = { version = "1.52.3", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
unicode-width = "0.2.2"
