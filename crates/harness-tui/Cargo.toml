[package]
name = "harness-tui"
version.workspace = true
edition.workspace = true

[features]
default = ["markdown-codewandler"]
# assistantの返答をMarkdownとして整形して描く実装（`src/markdown/codewandler/`）。**急場しのぎの依存**で、
# いずれ別の実装へ差し替える（`plans/PLAN-TUI-IMPROVEMENTS.md`§1.2・§1.6）。切ると整形しない実装
# （`src/markdown/plain.rs`）で描く。`cfg`を書くのは`src/markdown/mod.rs`の2か所だけ（Adapterのモジュール宣言と、
# 実装の選択）。描画部品は依存にせず、出典とライセンス表記ごと`src/markdown/codewandler/render.rs`へ写して直す
# （同§1.3の結論）——codewandlerから依存にするのは解析器だけ。もう1つの`unicode-segmentation`は、写した描画部品の
# 折り返し（T7a）が文字の区切りに使う。
markdown-codewandler = ["dep:codewandler-markdown-stream", "dep:unicode-segmentation"]

[dependencies]
async-trait = "0.1.89"
# Markdownの解析器（`markdown_stream`）。`markdown-codewandler`でだけ入る（上の`[features]`）。
codewandler-markdown-stream = { version = "0.2.1", optional = true }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.32"
harness-cognition = { version = "0.1.0", path = "../harness-cognition" }
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-engine = { version = "0.1.0", path = "../harness-engine" }
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }
harness-sandbox-vm = { version = "0.1.0", path = "../harness-sandbox-vm" }
# 端末の生モード/オルタネートスクリーン復帰（`harness-policy-editor`のTUIと共有）。
harness-term = { version = "0.1.0", path = "../harness-term" }
harness-tools = { version = "0.1.0", path = "../harness-tools" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
# 写した描画部品が行を文字（書記素）の間で切るときの区切り（`src/markdown/codewandler/render/wrap.rs`）。
# `markdown-codewandler`でだけ入る（上の`[features]`）。版はロックにあるもの（ratatuiが文字を数えるのに使う版）と同じ
# ——範囲選択が文字を数える区切りと揃える。
unicode-segmentation = { version = "1.13.3", optional = true }
unicode-width = "0.2.2"

[dev-dependencies]
# 写す前の描画部品そのもの（`markdown_ratatui`）。**試験だけが使う**——写した描画部品
# （`src/markdown/codewandler/render.rs`）が元と同じ出力を返すことを比べる相手（`codewandler/equivalence_tests.rs`）。
# 製品のビルドには入らない。
codewandler-markdown-ratatui = "0.2.1"
# `review_flow_tests`: 実FS上のオーバーレイに対して「パネル操作→部分適用」を通しで確かめる。
tempfile = "3.27.0"
