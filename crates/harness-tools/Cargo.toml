[package]
name = "harness-tools"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.42", features = ["process", "time", "io-util", "rt-multi-thread", "macros", "fs"] }

[dev-dependencies]
tempfile = "3"
