[package]
name = "harness-tools"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
cap-std = "4.0.2"
# LLM が場所を示した gzip・deflate＋base64 の中身を解読する（`encoded_payload`）。harness-review と同じ版。
flate2 = "1"
futures-util = "0.3"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
harness-core = { version = "0.1.0", path = "../harness-core" }
# 承認を中身に縛るとき（`approval_binding`）、パスがワークスペースの内側かを判定器と同じ規則で決める。
harness-change-ledger = { version = "0.1.0", path = "../harness-change-ledger" }
harness-sandbox = { version = "0.1.0", path = "../harness-sandbox" }
# [段階6b] `run_shell`が起こすシェルの遷移元ドメイン名（`policy_file::ENTRY_DOMAIN`）だけを使う。
# 綴りを写すと片方だけ変わるので、定数を借りる（純粋クレートなのでWin32もasyncも入らない）。
harness-policy = { version = "0.1.0", path = "../harness-policy" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 承認に縛るファイルの中身のハッシュ（`approval_binding`）。MCP の承認台帳と同じ SHA-256。
sha2 = "0.10"
tokio = { version = "1.42", features = ["process", "time", "io-util", "rt-multi-thread", "macros", "fs", "net"] }
which = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `dial`のstagger挙動を実時間を待たずに検証するため（`tokio::test(start_paused)`）。
tokio = { version = "1.42", features = ["test-util"] }
